<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Clik-Cart</title>
    <link rel="stylesheet" href="../Frontend CSS/style.css">
    <script src="../Frontend JS/wishlist.js" defer></script>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>Clik-Cart</h2>

        <ul>
            <li><a href="../Frontend HTML/index.html">Home</a></li>
            <li><a href="../Frontend HTML/products.html">Products</a></li>
            <li><a href="../Frontend HTML/cart.html">Cart</a></li>
            <li><a href="../Frontend HTML/profile.html">Profile</a></li>
        </ul>
    </nav>


    <!-- Wishlist -->
    <section class="wishlist-section">

        <div class="wishlist-container">

            <h1>My Wishlist</h1>

            <p class="wishlist-subtitle">
                Products you've saved for later
            </p>


            <!-- Wishlist Products -->
            <div id="wishlist-container">

                <!-- Products will be loaded by JavaScript -->

            </div>


            <!-- Empty Wishlist -->
            <div id="empty-wishlist" class="empty-wishlist">

                <h2>Your wishlist is empty</h2>
                <p>
                    Save products you like and find them here later.
                </p>
                <a href="../Frontend HTML/products.html" class="logout-btn">
                    Browse Products
                </a>

            </div>

        </div>
    </section>


    <!-- Footer -->
    <footer>
        <p>
            © 2026
            <a href="../Frontend HTML/index.html">Clik-Cart</a>.
            All Rights Reserved.
        </p>
    </footer>

</body>

</html>
