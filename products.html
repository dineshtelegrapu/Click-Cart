<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Frontend CSS/style.css">

    <title>Products - Clik-Cart</title>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <h2>Clik-Cart</h2>

        <input
            type="text"
            placeholder="Search products..."
            class="search-bar"
            id="search-bar"
        >

        <ul>
            <li class="language-menu">
                <a href="#" id="language-btn">Language ▼</a>
                <ul class="language-dropdown" id="language-dropdown">
                    <li><a href="#" data-lang="en">English</a></li>
                    <li><a href="#" data-lang="hi">हिन्दी</a></li>
                    <li><a href="#" data-lang="te">తెలుగు</a></li>
                </ul>
            </li>
            <li><a href="../Frontend HTML/index.html">Home</a></li>
            <li><a href="../Frontend HTML/cart.html">Cart</a></li>
        </ul>
    </nav>

    <!-- Breadcrumb / Filter Section -->
    <div class="breadcrumb">
        <div class="filter-section">
            <span class="filter-title">Filter:</span>
            <ul>
                <li><a href="#products-container" data-category="All">All Products</a></li>
                <li><a href="#products-container" data-category="Electronics">Electronics</a></li>
                <li><a href="#products-container" data-category="Accessories">Accessories</a></li>
            </ul>
        </div>
    </div>
    <!-- Products Section -->
    <section class="products">

        <h2>Our Products</h2>

        <div class="product-container" id="products-container">
            <p class="loading-message">Loading products...</p>
        </div>

    </section>

    <!-- Product API JavaScript -->
    <script src="../Frontend JS/products.js" defer></script>

</body>
</html>
