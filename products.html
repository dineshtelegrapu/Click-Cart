<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../Frontend CSS/style.css">

    <title>Products - Clik-Cart</title>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <h2>Clik-Cart</h2>

        <input
            type="text"
            placeholder="Search products..."
            class="search-bar"
            id="search-bar"
        >

        <ul>
            <li><a href="#">Language</a></li>
            <li><a href="../Frontend HTML/index.html">Home</a></li>
            <li><a href="../Frontend HTML/cart.html">Cart</a></li>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
        </ul>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <ul>
            <li><a href="#" data-category="All">All Products</a></li>
            <li><a href="#" data-category="Electronics">Electronics</a></li>
            <li><a href="#" data-category="Accessories">Accessories</a></li>
        </ul>

    <!-- Products Section -->
    <section class="products">

        <h2>Our Products</h2>

        <div class="product-container" id="products-container">

    <script src="../Frontend JS/products.js" defer></script>
