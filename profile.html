<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Clik-Cart</title>
    <link rel="stylesheet" href="../Frontend CSS/style.css">
    <script src="../Frontend JS/profile.js" defer></script>
</head>

<body>

    <nav>
        <h2>Clik-Cart</h2>
        <ul>
            <li><a href="../Frontend HTML/index.html">Home</a></li>
            <li><a href="../Frontend HTML/products.html">Products</a></li>
        </ul>
    </nav>
    <section class="profile-section">

        <div class="profile-card">

            <div class="profile-header">
                <div class="profile-image">
                    <label for="file-upload" class="custom-file-upload">Add Image</label>
                    <input id="file-upload" type="file" accept="image/*">
                </div>
                <h1 id="profile-name">User</h1>
                <p id="profile-email">
                    user@example.com
                </p>

            </div>
            <div class="profile-info">
                <h2>Account Information</h2>
                <div class="info-row">
                    <span>Name</span>
                    <strong id="user-name">User</strong>
                </div>
                <div class="info-row">
                    <span>Email</span>
                    <strong id="user-email">user@example.com</strong>
                </div>
            </div>

            <div class="profile-options">
                <a href="../Frontend HTML/cart.html" class="profile-option">
                    <span>My Cart</span>
                </a>
                <a href="../Frontend HTML/orders.html" class="profile-option">
                    <span>My Orders</span>
                </a>
                <a href="../Frontend HTML/wishlist.html" class="profile-option">
                    <span>Wishlist</span>
                </a>
                <a href="../Frontend HTML/account_settings.html" class="profile-option">
                    <span>Account Settings</span>
                </a>
            </div>

            <button id="logoutButton" class="logout-btn">
                Logout
            </button>
        </div>
    </section>

    <footer>
        <p>
            © 2026
            <a href="../Frontend HTML/index.html">Clik-Cart</a>.
            All Rights Reserved.
        </p>
    </footer>
</body>
</html>
